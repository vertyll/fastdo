# Security headers for every response. nginx drops the server's add_header directives in a location that has
# its own, so each location that adds a header includes this file again.
#
# The Dockerfile replaces @API_URL@, @API_WS_URL@ and @STORAGE_URL@ with the gateway, its WebSocket address and
# the object storage that serves files through presigned addresses. 'unsafe-eval' is there for messageformat,
# which compiles ICU messages with new Function; 'unsafe-inline' styles for the styles Angular and its
# components insert at run time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: @STORAGE_URL@; font-src 'self' data:; connect-src 'self' @API_URL@ @API_WS_URL@ @STORAGE_URL@; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
