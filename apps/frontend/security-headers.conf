# Security headers for every response. nginx drops the server's add_header directives in a location that has
# its own, so each location that adds a header includes this file again.
#
# The Dockerfile replaces @API_URL@, @API_WS_URL@ and @STORAGE_URL@ with the gateway, its WebSocket address and
# the object storage that serves files through presigned addresses.
#
# No 'unsafe-eval', 'unsafe-inline' or 'unsafe-hashes': ICU messages are interpreted by FormatJS, not compiled
# into code, and the <style> elements Angular and its components insert at run time carry a nonce. nginx.conf
# writes $request_id, 16 random bytes in hex and new for every request, into the ngCspNonce attribute of
# index.html, and the build and Angular copy it onto each <script> and <style> they add. With 'strict-dynamic', a
# script runs only if it carries the nonce or is loaded by one that does, as the lazy chunks are; style-src allows
# only that nonce besides the application's own style sheets. A style attribute is refused; styles set from code through element.style are
# not inline markup and stay allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob: @STORAGE_URL@; font-src 'self' data:; connect-src 'self' @API_URL@ @API_WS_URL@ @STORAGE_URL@; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
